# TMUX Configuration for YouTubeリサーチ Development

# =====================================
# 基本設定
# =====================================

# プレフィックスキーをCtrl-aに変更
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# マウス操作を有効化
set -g mouse on

# ウィンドウとペインのインデックスを1から始める
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウ番号を自動的に振り直す
set -g renumber-windows on

# エスケープキーの遅延を減らす
set -s escape-time 0

# 履歴の行数を増やす
set -g history-limit 10000

# =====================================
# キーバインド
# =====================================

# 設定ファイルの再読み込み
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ペイン分割をより直感的に
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ペイン間の移動 (Vim風)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ペインのリサイズ
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ウィンドウの移動
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# =====================================
# 外観設定
# =====================================

# 256色サポート
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ステータスバーの色
set -g status-style bg=colour235,fg=colour255

# アクティブなウィンドウの色
setw -g window-status-current-style bg=colour27,fg=colour255,bold

# ペインの境界線の色
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour27

# ステータスバーの内容
set -g status-left-length 40
set -g status-left "#[fg=green]Session: #S #[fg=yellow]Window: #I #[fg=cyan]Pane: #P"
set -g status-right "#[fg=cyan]%Y-%m-%d %H:%M"
set -g status-interval 60

# ステータスバーの位置
set -g status-position bottom

# ウィンドウリストの表示位置
set -g status-justify centre

# =====================================
# コピーモード設定
# =====================================

# Vimキーバインドを使用
setw -g mode-keys vi

# コピーモードのキーバインド
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# =====================================
# プラグイン設定（オプション）
# =====================================

# TPM (Tmux Plugin Manager) を使用する場合
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'

# プラグインマネージャーの初期化（最後に記述）
# run '~/.tmux/plugins/tpm/tpm'

# =====================================
# プロジェクト固有の設定
# =====================================

# 新しいウィンドウでプロジェクトディレクトリを開く
bind c new-window -c "#{pane_current_path}"

# 開発環境用のレイアウトを作成
bind D source-file ~/.tmux/layouts/dev-layout.conf
